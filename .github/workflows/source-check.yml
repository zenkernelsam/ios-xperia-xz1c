name: canonical-source-check
on:
  workflow_dispatch:
  push:
    paths: ["gpu/**", "xnu/lilac-current.patch", "tools/**", "reproducibility/**", ".github/workflows/source-check.yml"]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/validate_current.py
      - run: python3 -B -m unittest test_boot_once test_current_transport
        working-directory: tools/device
